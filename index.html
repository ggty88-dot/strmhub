<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Molo2 Streaming Hub</title>
<link rel="icon" id="fav">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800&family=Itim&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#141414;--sub:#5f6272;--blue:#2447d6;--yel:#ffd84d;--p1:#dde5ff;--p2:#fff1b3;--line:#141414;--card:#fff;--sp:#1DB954;--hf:Jua,Itim,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}html{font-synthesis-weight:none}
body{background:var(--bg);color:var(--ink);font-family:Nunito,Itim,system-ui,sans-serif;line-height:1.5;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.f{font-family:var(--hf);margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:16px}
.sec{margin-top:22px}
.sec>.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec h2{font-size:20px;font-weight:800}
.head{display:flex;align-items:center;gap:12px;background:var(--p1);border:2px solid var(--line);border-radius:28px;padding:12px 16px}
.head h1{font-size:24px;color:var(--blue)}
.hero{text-align:center}
.hero h1{font-size:clamp(20px,6vw,27px);font-weight:800;line-height:1.15;margin-top:4px}
.hero h1 span{color:var(--blue)}
.fm{display:inline-block;color:var(--blue);font:400 16px var(--hf);background:linear-gradient(transparent 62%,var(--p2) 62%);padding:0 10px}
.dash{color:var(--sub);font-size:14px;margin-top:2px}
.songs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.song{all:unset;cursor:pointer;display:block;text-align:center;background:#fff;border:2px solid var(--line);border-radius:20px;padding:7px 6px}
.song:active,.btn:active{opacity:.7}
.song:focus-visible,button:focus-visible,.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.cover{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 15px var(--hf);position:relative;overflow:hidden}
.song b{font:800 12px/1.2 var(--hf);margin-top:6px;min-height:30px;display:flex;align-items:center;justify-content:center}
.sbtn{display:block;margin-top:3px;background:var(--sp);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:2px 0}
.plats{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.plat{all:unset;cursor:pointer;flex:0 0 92px;scroll-snap-align:start;background:#fff;border:2px solid var(--line);border-radius:24px;text-align:center;padding:10px 4px}
.plat i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;margin:0 auto 4px;font:800 18px var(--hf);font-style:normal;background:var(--p1)!important;color:var(--blue)!important}
.plat span{display:block;font-size:12px;font-weight:800}.plat em{font-style:normal;font-size:11px;color:var(--blue);font-weight:700}
.kr{display:block;font-size:9px;background:var(--p2);border-radius:8px;margin:2px 6px 0}
.grid2{display:grid;gap:16px}
@media(min-width:700px){.wrap{max-width:860px}.grid2.lv{grid-template-columns:1fr 1.3fr}}
.mem{background:var(--p1);border:2px solid var(--line);border-radius:28px;padding:16px}
.mem .mt{display:flex;justify-content:space-between;align-items:center}.mem h3{font-size:24px;color:var(--blue);font-weight:800}.mem small{color:var(--sub)}
.xbar,.bar{height:12px;background:#fff;border:2px solid var(--line);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.xbar>div,.bar>div{height:100%;background:repeating-linear-gradient(115deg,#5b72ee 0 10px,var(--blue) 10px 20px);border-radius:99px;transition:width .6s}
.xr{font-size:13px;font-weight:700}
.hand{font:700 16px var(--hf);color:var(--blue);text-align:center;margin-top:8px}
.journey{display:grid;grid-template-columns:repeat(5,minmax(62px,1fr));gap:10px 6px;overflow-x:auto}
.lvb{all:unset;cursor:pointer;text-align:center;border-radius:18px;padding:6px 2px}
.lvb.on{background:var(--p2);outline:2px solid var(--ink)}
.lvb.off svg{opacity:.4;filter:grayscale(.5)}
.lvb small{display:block;font:800 11px var(--hf)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat div{border:2px solid var(--ink);border-radius:28px;padding:16px;font-size:14px;font-weight:700}

.stat b{font:800 36px/1.1 var(--hf);display:block;color:var(--ink)}
.qa2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa2 button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:26px;padding:14px 12px}
.qa2 i{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--blue)}
.qa2 b{display:block;font:800 15px/1.2 var(--hf)}.qa2 small{display:block;color:var(--sub);font-size:12px;line-height:1.3}
.stamp .stt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tagb{background:var(--p1);color:var(--blue);border-radius:99px;padding:1px 12px;font:800 13px var(--hf)}
.dots{display:flex;justify-content:space-between}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:16px}
.dot.fill{background:var(--p2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--p2);border:2px solid var(--ink);border-radius:99px;padding:3px 14px;font:800 14px var(--hf)}
.feed .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--p1);font-size:14px}.feed .it:last-child{border:0}
.btn{all:unset;box-sizing:border-box;display:inline-block;cursor:pointer;background:var(--blue);color:#fff;font:800 16px var(--hf);border-radius:99px;padding:10px 26px;text-align:center}
.btn.alt{background:var(--p1);color:var(--blue)}
.link{all:unset;cursor:pointer;color:var(--blue);font-size:13px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;padding:0 16px;pointer-events:none}
nav>div{pointer-events:auto;display:flex;max-width:420px;margin:0 auto;background:var(--blue);border:2px solid var(--ink);border-radius:99px;padding:6px;box-shadow:0 8px 20px rgba(36,71,214,.28)}
.tab{all:unset;cursor:pointer;flex:1;text-align:center;font:400 12px var(--hf);padding:6px 0;border-radius:99px;color:#fff;border:2px solid transparent}
.tab span{display:flex;justify-content:center}.tab.on{background:var(--yel);color:var(--ink);border-color:var(--ink)}

.modal{position:fixed;inset:0;background:rgba(22,32,91,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}.modal .card{width:100%;max-width:400px;max-height:90vh;overflow:auto;text-align:center;border-radius:30px}
input,select{width:100%;font:inherit;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);margin-top:8px}
label{display:block;text-align:left;font-size:13px;font-weight:700;margin-top:10px}
.menu button{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%;padding:13px 4px;border-bottom:1px solid var(--p1);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90%}
.toast.show{opacity:1}
.up{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.up{animation:none}.xbar>div,.bar>div{transition:none}}
.pg{display:none}.pg.on{display:block}
.card,.mem,.head,.stat div,.qa2 button{border-radius:30px 26px 32px 24px/26px 32px 24px 30px}
.song,.plat{border-radius:24px 20px 26px 22px/22px 26px 20px 24px}
.card,.mem{position:relative;overflow:hidden}
.card::before,.mem::before{content:"";position:absolute;right:-26px;top:-28px;width:92px;height:92px;border-radius:50%;background:var(--p1);z-index:0;pointer-events:none}
.card.stamp::before,.card.feed::before{background:var(--p2)}
.card>*,.mem>*{position:relative;z-index:1}
.btn{background:var(--yel);color:var(--ink);border:2px solid var(--ink)}
.btn.alt{background:#fff;color:var(--blue);border-color:var(--blue)}
.sbtn{border:1.5px solid var(--ink)}
.qa2 i,.plat i{border:2px solid var(--ink)}
.dot{color:var(--ink)}
</style>
</head>

<div class="wrap" id="app"></div>
<nav><div id="nav"></div></nav>
<div class="modal" id="modal"><div class="card" id="mbox"></div></div>
<div class="toast" id="toast"></div>

const mascot=(s=56)=>`<img src="${MASC}" alt="Molo2 mascot" style="width:${s}px;height:auto;display:inline-block">`;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2400)}
function open_(u){if(!u)return toast(t("nolink"));window.open(u,"_blank","noopener")}
function openLink(i){open_(SONGS[i].u)}
function cover(i){const s=SONGS[i];return `<div class="cover" style="background:${s.img?`center/cover url('${s.img}')`:`linear-gradient(135deg,${s.c[0]},${s.c[1]})`}">${s.img?"":'<span style="position:absolute;top:4px;left:8px;opacity:.5;font-size:11px">MARK</span>'}${s.img?"":s.t.length<6?s.t:"♪"}</div>`}
const API="/api/rpc";
async function api(a,d={}){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({a,token:S.token,...d})});return await r.json()}catch(e){return{error:"network"}}}
function apply(j){if(!j||j.error)return;S.xp=j.me.xp;S.log=j.me.log;S.checks=j.me.checks;S.stats=j.stats;S.feed=j.feed;if(j.cfg){j.cfg.songs.forEach((o,i)=>{if(SONGS[i]){SONGS[i].u=o.u||SONGS[i].u;SONGS[i].img=o.img||SONGS[i].d}});j.cfg.plats.forEach((u,i)=>{if(PLATS[i])PLATS[i].url=u})}save()}
async function sync(){if(!S.token)return;const j=await api("state");if(j.error==="auth"){S.token="";save();return autoLogin()}apply(j);render()}
const ago=ts=>{const m=Math.round((Date.now()-ts)/60000);return m<1?"now":m<60?m+"m":m<1440?Math.round(m/60)+"h":Math.round(m/1440)+"d"};
let tab="home";
function render(){
document.documentElement.lang=S.lang;
const lv=lvOf(S.xp),cur=LV[lv],nx=LV[lv+1],pct=nx?Math.round((S.xp-cur[1])/(nx[1]-cur[1])*100):100,xpTxt=nx?`${S.xp} / ${nx[1]} XP`:`${S.xp} XP`;
const td=day(),ups=S.log.filter(l=>l.d===td),didCheck=S.checks.includes(td);
const mon=S.checks.filter(c=>{const p=c.split("-");const n=new Date();return +p[0]===n.getFullYear()&&+p[1]===n.getMonth()+1}).length;
const levelCard=`<div class="mem"><div class="mt"><div><small>Cheetah Journey</small><h3>LV.${lv+1} ${cur[0]}</h3></div><div class="up" id="bigcoin">${coin(lv,92)}</div></div><div class="xbar"><div style="width:${pct}%"></div></div><div class="xr">${xpTxt}</div><div class="hand">${t("hand")}</div></div>`;
const wk=[6,5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-i);return S.checks.includes(day(d))});
const qs=S.lang==="th"?["ร่วมสตรีมกับแฟน ๆ","สร้างการ์ดของคุณ","เช็กอินวันนี้","อัปเดตยอดสตรีม"]:["Stream together","Create yours today","Check in for the day","Update your totals"];
const home=`<header class="hero">${mascot(84)}<h1>Molo2 <span>streaming hub</span></h1><div><span class="fm">${t("sub")}</span></div><div class="dash">dashboard</div></header>
<div class="sec"><div class="hd"><h2>${t("songs")}</h2></div><div class="songs">${SONGS.map((s,i)=>`<button class="song" onclick="openLink(${i})" aria-label="${s.t}">${cover(i)}<b>${s.t}</b><span class="sbtn">${t("stream")}</span></button>`).join("")}</div></div>
<div class="sec"><div class="hd"><h2>${t("plats")}</h2><button class="link" onclick="toast(t('nolink'))">${t("all")}</button></div><div class="plats">${PLATS.map((p,i)=>`<button class="plat" onclick="open_(PLATS[${i}].url)"><i>${ic("p"+i,26)}</i><span>${p[0]}</span>${p[3]?'<small class="kr">KR Digital Chart</small>':""}<em>Stream →</em></button>`).join("")}</div></div>
<div class="sec grid2 lv"><div><div class="hd" style="margin-bottom:10px"><h2 class="f">${t("lvl")}</h2></div>${levelCard}</div><div><div class="hd" style="margin-bottom:10px"><h2 class="f">${t("jr")}</h2></div><div class="card"><div class="journey">${LV.map((l,i)=>`<button class="lvb ${i===lv?"on":i>lv?"off":""}" onclick="lvInfo(${i})">${coin(i,56)}<small>LV.${i+1}</small></button>`).join("")}</div><div class="hand" style="font-size:16px">${t("jrn")}</div></div></div></div>
<div class="sec stat"><div style="background:var(--p1)"><b>${S.stats.today}</b>${t("today")}</div><div style="background:var(--p2)"><b>${S.stats.total}</b>${t("total")}</div></div>
<div class="sec qa2"><button onclick="toast(t('soon'))"><i style="background:var(--p1)">${ic("party")}</i><span><b>${t("qa")[0]}</b><small>${qs[0]}</small></span></button><button onclick="toast(t('soon'))"><i style="background:var(--p2)">${ic("cert")}</i><span><b>${t("qa")[1]}</b><small>${qs[1]}</small></span></button><button onclick="checkin()"><i style="background:var(--p1)">${ic("check")}</i><span><b>${t("qa")[2]}</b><small>${qs[2]}</small></span></button><button onclick="quick()"><i style="background:var(--blue);color:#fff">${ic("bolt")}</i><span><b>${t("qa")[3]}</b><small>${qs[3]}</small></span></button></div>
<div class="sec card stamp"><div class="stt"><span class="tagb">${S.lang==="th"?"เช็กอิน 7 วันล่าสุด":"Last 7 days"}</span><b class="f" style="color:var(--blue)">${wk.filter(Boolean).length}/7</b></div><div class="dots">${wk.map(o=>`<span class="dot ${o?"fill":""}">${o?ic("paw",20):""}</span>`).join("")}</div></div>
<div class="sec"><div class="hd"><h2>${t("focus")}</h2></div><div class="chips">${SONGS.slice(0,2).map(s=>`<span class="chip">${s.t}</span>`).join("")}</div></div>
<div class="sec"><div class="hd"><h2>${t("act")}</h2></div><div class="card feed">${feed()}<small style="color:var(--sub)">${t("actn")}</small></div></div>`;
const party=`<div class="head">${mascot(56)}<h1>${t("party")}</h1></div><div class="card sec" style="text-align:center">${t("soon")}</div>`;
const hist=`<div class="head">${mascot(56)}<h1>${t("hist")}</h1></div><div class="sec card feed">${S.log.length?S.log.slice().reverse().map(l=>`<div class="it"><b>${l.n.toLocaleString()}</b><span>${SONGS[l.s].t} · ${PLATS[l.p][0]}</span><small style="margin-left:auto;color:var(--sub)">${l.d}</small></div>`).join("")+`<div class="it"><b>${t("tot")}</b><span>${S.log.reduce((a,l)=>a+l.n,0).toLocaleString()}</span></div>`:t("nohist")}</div>`;
const my=`<div class="card" style="text-align:center;background:var(--p1)"><div style="display:inline-block">${mascot(70)}</div><h2 style="font-size:20px">${nm(S.user)}</h2><div style="display:flex;justify-content:center;gap:8px;align-items:center;margin-top:6px">${coin(lv,48)}<b class="f">LV.${lv+1} ${cur[0]}</b></div><div class="bar" style="margin:10px 0 4px"><div style="width:${pct}%"></div></div><small>${xpTxt}</small><p style="margin:10px 0 0;font-size:14px">${t("month")}: <b>${mon}</b> · ${t("streak")}: <b>${streak()} ${t("days")}</b></p></div>
<div class="card sec menu"><button onclick="quick()">${t("qa")[3]} <span>›</span></button><button onclick="checkin()">${t("ci")} <span>›</span></button><button onclick="toast(t('soon'))">Certificate <span>›</span></button><button onclick="tab='hist';render()">${t("myact")} <span>›</span></button><button onclick="modal('<h2>${t("howto")}</h2><p>${t("howt")}</p>')">${t("howto")} <span>›</span></button><button onclick="S.lang=S.lang==='th'?'en':'th';save();render()">${S.lang==="th"?"ภาษา / Language":"Language"} <span>${t("lang")}</span></button><button onclick="adminDlg()">${t("admin")} <span>›</span></button></div>`;
$("app").innerHTML=`<div class="pg ${tab==="home"?"on":""}">${home}</div><div class="pg ${tab==="party"?"on":""}">${party}</div><div class="pg ${tab==="hist"?"on":""}">${hist}</div><div class="pg ${tab==="my"?"on":""}">${my}</div>`;
$("nav").innerHTML=[["home","🏠"],["party","🎉"],["hist","📊"],["my","😺"]].map(x=>`<button class="tab ${tab===x[0]?"on":""}" onclick="tab='${x[0]}';render();scrollTo(0,0)"><span>${ic(x[0])}</span>${t(x[0])}</button>`).join("");
}
function feed(){return S.feed.length?S.feed.map(f=>`<div class="it">${coin(f.l,30)}<span>${nm(f.u)} ${f.l>=7?ic("crown",15):""} · ${SONGS[f.s]?SONGS[f.s].t:""} · ${PLATS[f.p][0]}</span><small style="margin-left:auto;color:var(--sub)">${ago(f.t)}</small></div>`).join(""):`<p style="margin:0 0 8px;color:var(--sub);font-size:14px">${t("none")}</p>`}
function streak(){let n=0,d=new Date();while(S.checks.includes(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function modal(h){$("mbox").innerHTML=h+`<p><button class="btn alt" onclick="closeM()">${t("cancel")}</button></p>`;$("modal").classList.add("show")}
function closeM(){$("modal").classList.remove("show")}
function fin(a){render();if(lvOf(S.xp)>a)modal(`<div class="up">${coin(lvOf(S.xp),120)}</div><h2>${t("lvup")}</h2><p class="f">LV.${lvOf(S.xp)+1} ${LV[lvOf(S.xp)][0]}</p>`)}
function lvInfo(i){modal(`${coin(i,90)}<h2>LV.${i+1} ${LV[i][0]}</h2><p>${t("need")} ${LV[i][1].toLocaleString()} XP</p>`)}
async function checkin(){const a=lvOf(S.xp);const j=await api("checkin");if(j.error==="done"){modal(`<h2>${t("cidone")}</h2>`);return}if(j.error)return toast(j.error);apply(j);toast(t("ciok")+" +"+j.gain);fin(a)}
function quick(){const td=day();if(S.log.filter(l=>l.d===td).length>=XP.maxUpdates){modal(`<h2>${t("upd")}</h2><p>${t("limit")}</p>`);return}
modal(`<h2>${t("upd")}</h2><label>${t("song")}<select id="qs">${SONGS.map((s,i)=>`<option value="${i}">${s.t}</option>`).join("")}</select></label><label>${t("plat")}<select id="qp">${PLATS.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join("")}</select></label><label>${t("cnt")}<input id="qn" type="number" inputmode="numeric" min="1" placeholder="0"></label><p id="qm" style="color:var(--blue);font-size:13px;min-height:18px"></p><p><button class="btn" onclick="submitQ()">${t("save")}</button></p>`);
$("mbox").lastElementChild.remove();$("mbox").insertAdjacentHTML("beforeend",`<p style="margin:0"><button class="btn alt" onclick="closeM()">${t("cancel")}</button></p>`)}
let warned=false;
async function submitQ(){const n=parseInt($("qn").value,10);if(!n||n<1){$("qm").textContent=t("bad");return}if(n>300&&!warned){warned=true;$("qm").textContent=t("big");return}warned=false;const a=lvOf(S.xp);const j=await api("update",{s:+$("qs").value,p:+$("qp").value,n});if(j.error==="limit"){closeM();modal(`<h2>${t("upd")}</h2><p>${t("limit")}</p>`);return}if(j.error){$("qm").textContent=t("bad");return}closeM();apply(j);fin(a)}
function pinDlg(){modal(`<h2>${t("pin")}</h2><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><p><button class="btn" onclick="setPin()">${t("save")}</button></p>`);$("mbox").lastElementChild.remove();$("mbox").insertAdjacentHTML("beforeend",`<p style="margin:0"><button class="btn alt" onclick="closeM()">${t("cancel")}</button></p>`)}
function swap(){S.user="";S.pin="";S.token="";save();welcome()}
function welcome(){$("mbox").innerHTML=`${mascot(96)}<h2>${t("welcome")}</h2><p style="color:var(--sub)">${t("wsub")}</p><input id="wu" placeholder="@account" autocapitalize="none" autocomplete="off"><p id="wm" style="color:var(--blue);font-size:13px;min-height:18px"></p><p><button class="btn" onclick="doLogin()">${t("start")}</button></p>`;$("modal").classList.add("show")}
async function doLogin(){const u=$("wu").value.trim().replace(/^@/,"").toLowerCase(),p="";if(!u)return;const j=await api("login",{user:u,pin:p});if(j.error==="pin"){$("wm").textContent=t("badpin");return}if(j.error){$("wm").textContent=j.error;return}S.user=j.user;S.token=j.token;apply(j);closeM();render()}
async function setPin(){const v=$("pn").value;if(!/^\d{4}$/.test(v))return;await api("setpin",{pin:v});closeM();toast(t("pinok"))}
function adminDlg(){modal(`<h2>${t("admin")}</h2><input id="apw" type="password" placeholder="Admin password">${SONGS.map((s,i)=>`<label>${s.t}<input id="al${i}" value="${s.u||""}" placeholder="Spotify link"><input id="ai${i}" value="${s.img||""}" placeholder="Cover image URL"></label>`).join("")}${PLATS.map((p,i)=>`<label>${p[0]}<input id="ap${i}" value="${p.url||""}" placeholder="https://..."></label>`).join("")}<p id="am" style="color:var(--blue)"></p><p><button class="btn" onclick="adminSave()">${t("save")}</button></p>`)}
async function adminSave(){const cfg={songs:SONGS.map((_,i)=>({u:$("al"+i).value.trim(),img:$("ai"+i).value.trim()})),plats:PLATS.map((_,i)=>$("ap"+i).value.trim())};const j=await api("admin",{pw:$("apw").value,cfg});if(j.error){$("am").textContent="Wrong password";return}closeM();await sync();toast("Saved")}
function nm(u){return u&&u.startsWith("fan_")?"Fan "+u.slice(4,8).toUpperCase():"@"+(u||"")}
async function autoLogin(){if(!S.user)S.user="fan_"+Math.random().toString(36).slice(2,10);const j=await api("login",{user:S.user,pin:""});if(j.error)return;S.user=j.user;S.token=j.token;apply(j);render()}
render();S.token?sync():autoLogin();setInterval(sync,600000);
</script>
</body>
</html>
